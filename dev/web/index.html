<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="DevRadar: find developers near you by their tech stack"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json describes the app when it is installed on a device. See
      https://developer.mozilla.org/docs/Web/Manifest
    -->
    <link rel="manifest" href="/manifest.json" />
    <!--
      Files in public/ are served from the site root as they are (dev server) and copied to the
      root of build/ (npm run build), so they are referenced with absolute "/" paths.
    -->
    <title>DevRadar</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- Entry point: npm start serves src/index.jsx; npm run build replaces this tag with the bundled, hashed script. -->
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
