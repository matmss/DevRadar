// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    // Detox's real Android artifact ships as a pre-built local maven repo inside its
    // own npm package - it must come before mavenCentral(), which otherwise resolves
    // "com.wix:detox" to an unrelated, unmaintained package of the same name.
    maven { url "$rootDir/../node_modules/detox/Detox-android" }
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
