appId: com.matmss.mobile
---
# Covers: map-search.feature "Searching by tech shows matching nearby developers as markers" (@smoke)
# Since auth slice 4 GET /search and the socket need a session: this flow signs in first through
# subflows/sign-in-with-github.yaml (real GitHub; see that file for the env vars and backend).
# Precondition: a matching developer registered near the device's location. POST /devs needs a
# session token too, e.g. register through the web app, or with a token from a sign-in:
#   curl -X POST $API_URL/devs -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
#     -d '{"techs":"ReactJS","latitude":...,"longitude":...}'
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- runFlow: subflows/sign-in-with-github.yaml
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 20000
- tapOn:
    id: "search-input"
- inputText: "ReactJS"
- tapOn:
    id: "search-button"
# The search sent the session token: an auth failure would have gone back to the sign-in screen,
# any other failure shows the search error.
- assertNotVisible: "Entrar com GitHub"
- assertNotVisible:
    id: "search-error"
- assertVisible: "Sair"
