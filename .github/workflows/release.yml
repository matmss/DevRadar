name: Release

# Tags a release only after the full regression suite is green (the release
# gate defined in qa/docs/04-qa-process.md §4/§7), builds the web client, and
# publishes a GitHub Release with the build attached. There's no deployment
# target defined for this project (see CLAUDE.md) — this stops at "cut a
# GitHub release", it doesn't ship anywhere.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release, e.g. v1.2.0'
        required: true
        type: string

env:
  NODE_VERSION: lts/*

jobs:
  regression-gate:
    name: Regression gate
    uses: ./.github/workflows/regression.yml

  build-web:
    name: Build web client
    needs: regression-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install web app dependencies
        working-directory: dev/web
        run: npm install

      - name: Build web client
        working-directory: dev/web
        run: npm run build

      - name: Package build
        working-directory: dev/web
        run: zip -r ../../devradar-web-${{ inputs.tag || github.ref_name }}.zip build

      - uses: actions/upload-artifact@v4
        with:
          name: devradar-web-build
          path: devradar-web-*.zip
          retention-days: 90

  github-release:
    name: Publish GitHub Release
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devradar-web-build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: devradar-web-*.zip
