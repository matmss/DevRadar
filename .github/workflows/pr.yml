name: PR Checks

# Fast-feedback gate for every pull request into main: unit tests for every
# layer (backend, web, mobile), then the functional/integration BDD suites for
# backend and web. See qa/docs/04-qa-process.md §1/§7 for the level definitions
# and the "PR merge" entry/exit criteria this workflow enforces. Each job runs
# independently, so one layer's failure never hides another layer's result.
#
# Mobile *unit* tests (Jest + jest-expo: dev/tests/mobile/ and
# qa/mobile-tests/unit/) run here; they need no simulator. Mobile E2E (Detox,
# Maestro) is intentionally not run: it needs a simulator/emulator and is
# opt-in even locally (`RUN_MOBILE=true`), and BUG-009 (qa/docs/05-bug-tracker.md)
# flags the automated Detox run as environment-suspect. It stays manual.

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Every install root (dev/backend, dev/web, dev/mobile, and qa/ for the three
  # qa/*-tests workspaces) has a committed package-lock.json, so every install
  # below is `npm ci`: exact locked versions, and it fails if a lockfile is out
  # of sync with its package.json. setup-node caches ~/.npm keyed on the
  # lockfiles each job installs from.
  NODE_VERSION: lts/*

jobs:
  backend:
    name: Backend (unit + functional + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dev/backend/package-lock.json
            qa/package-lock.json

      # mongodb-memory-server downloads a real mongod binary on first use;
      # cache it so PRs don't re-pay that download every run.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-v10

      - name: Install backend app dependencies
        working-directory: dev/backend
        run: npm ci

      - name: Install QA workspace dependencies
        working-directory: qa
        run: npm ci

      - name: Run backend unit tests (calculateDistance, parseStringAsArray)
        working-directory: qa
        run: npm run unit --workspace=backend-tests

      - name: Run backend functional + integration suite
        working-directory: qa
        run: npm run test:backend

      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: qa/reports/backend.json
          if-no-files-found: ignore
          retention-days: 14

  web-unit:
    name: Web unit (Jest, react-scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dev/web/package-lock.json

      - name: Install web app dependencies
        working-directory: dev/web
        run: npm ci

      # react-scripts test starts in watch mode unless CI is set; --watchAll=false
      # makes the single run explicit, so the step always terminates.
      - name: Run web unit tests (src/services + src/components)
        working-directory: dev/web
        env:
          CI: 'true'
        run: npm test -- --watchAll=false

  mobile-unit:
    name: Mobile unit (Jest, jest-expo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dev/mobile/package-lock.json

      # The only install this job needs: qa/mobile-tests' unit run uses
      # dev/mobile's Jest binary and jest-expo preset, and its config
      # (qa/mobile-tests/unit/jest.config.js) resolves every module from
      # dev/mobile/node_modules, so the qa/ workspace is not installed here.
      - name: Install mobile app dependencies
        id: install-mobile
        working-directory: dev/mobile
        run: npm ci

      - name: Run mobile unit tests (dev/tests/mobile/)
        working-directory: dev/mobile
        run: npm test -- --ci

      # Runs even when the step above failed, so a dev-side failure never hides
      # the QA-side result; skipped only if the install failed.
      - name: Run QA mobile unit tests (qa/mobile-tests/unit/)
        if: ${{ !cancelled() && steps.install-mobile.outcome == 'success' }}
        working-directory: qa/mobile-tests
        run: npm run unit -- --ci

  web:
    name: Web (functional, real backend + real Mongo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dev/backend/package-lock.json
            dev/web/package-lock.json
            qa/package-lock.json

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-v10

      # Key the browser cache on the locked playwright-core version: each version pins its own
      # browser builds, and unrelated qa dependency bumps leave the cache valid. Fails if missing.
      - name: Read locked Playwright version
        id: playwright-version
        run: |
          node -e "const v = require('./qa/package-lock.json').packages['node_modules/playwright-core']?.version; if (!v) throw new Error('playwright-core is not in qa/package-lock.json'); console.log('version=' + v)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # web-tests boots the real backend in-process (features/support/backend-server.js)
      # and the real CRA dev server (features/support/global-setup.js), so both
      # dev/backend and dev/web need their own node_modules present.
      - name: Install backend app dependencies
        working-directory: dev/backend
        run: npm ci

      - name: Install web app dependencies
        working-directory: dev/web
        run: npm ci

      - name: Install QA workspace dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa/web-tests
        # Browser first, then system packages as best effort: GitHub's Ubuntu images already ship
        # Chromium's libraries, and apt mirror outages (DNS failures resolving archive.ubuntu.com)
        # used to fail this step after ~10 minutes before any test ran.
        run: |
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium \
            || echo "::warning::playwright install-deps failed or timed out; relying on the runner image's libraries"

      - name: Run web functional suite
        working-directory: qa
        run: npm run test:web

      - name: Upload web test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-report
          path: |
            qa/reports/web-html
            qa/reports/web.json
          if-no-files-found: ignore
          retention-days: 14
