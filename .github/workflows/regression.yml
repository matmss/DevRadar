name: Regression

# Full @regression-tagged suite across backend + web, per
# qa/docs/04-qa-process.md §4: runs nightly on main and on-demand before a
# release tag (release.yml calls this as a gate via workflow_call). A
# release cannot ship with a failing regression run.
#
# This nightly run covers the backend + web BDD suites only. Unit tests (all
# layers, including mobile) run on every PR in pr.yml, not here. Mobile E2E
# (Detox/Maestro) stays out of every automated run (BUG-009 in
# qa/docs/05-bug-tracker.md); run `cd qa && npm run test:mobile` manually
# against a simulator/emulator instead.

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC nightly
  workflow_dispatch: {}
  workflow_call: {}

env:
  # Installs are `npm ci` from the committed lockfiles; see the note in pr.yml.
  NODE_VERSION: lts/*

jobs:
  backend:
    name: Backend regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dev/backend/package-lock.json
            qa/package-lock.json

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-v10

      - name: Install backend app dependencies
        working-directory: dev/backend
        run: npm ci

      - name: Install QA workspace dependencies
        working-directory: qa
        run: npm ci

      - name: Run backend @regression suite
        working-directory: qa
        run: npm run test:regression --workspace=backend-tests

  web:
    name: Web regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            dev/backend/package-lock.json
            dev/web/package-lock.json
            qa/package-lock.json

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-v10

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.48

      - name: Install backend app dependencies
        working-directory: dev/backend
        run: npm ci

      - name: Install web app dependencies
        working-directory: dev/web
        run: npm ci

      - name: Install QA workspace dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browsers
        working-directory: qa/web-tests
        # Browser first, then system packages as best effort: GitHub's Ubuntu images already ship
        # Chromium's libraries, and apt mirror outages (DNS failures resolving archive.ubuntu.com)
        # used to fail this step after ~10 minutes before any test ran.
        run: |
          npx playwright install chromium
          timeout 180 npx playwright install-deps chromium \
            || echo "::warning::playwright install-deps failed or timed out; relying on the runner image's libraries"

      - name: Run web @regression suite
        working-directory: qa
        run: npm run test:regression --workspace=web-tests

      - name: Upload web regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-regression-report
          path: |
            qa/reports/web-html
            qa/reports/web.json
          if-no-files-found: ignore
          retention-days: 30
