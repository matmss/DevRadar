name: Feature Request
description: Propose a new capability or enhancement.
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options:
        - Backend
        - Web
        - Mobile
        - Cross-layer
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's missing or painful today? Link to a bug or discussion if relevant.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given/When/Then, one scenario per line group — same convention the PO agent uses.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
    validations:
      required: false
